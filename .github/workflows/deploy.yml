name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Publishes from an ephemeral artifact rather than force-pushing a branch.
#
# That is what retired the two-branch split: `master` used to have its entire
# contents replaced on every deploy, so source had to live somewhere else, and
# `dev` existed to hold it. Nothing writes to a branch now, so the default
# branch is both the source of truth and the deploy trigger.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing publishes until this passes. The suite asserts properties of the
  # built output — no framework JS, the CSS budget, a no-flash first paint,
  # every rendered character present in the subset font — and every one of
  # them is the kind of thing a routine dependency bump can quietly undo.
  test:
    runs-on: ubuntu-latest
    # No `pages: write` here: this job runs the repo's own test code, which is
    # a far wider surface than the pinned actions below. It only needs to read
    # the checkout.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The runner has neither Georgia nor Times New Roman, so the font-swap
      # reflow test would otherwise fall through to whatever generic serif the
      # image happens to ship and assert nothing meaningful. These are the two
      # faces the Linux `@font-face` overrides in global.css are calibrated
      # against, so installing them is what makes that test a real check here.
      - name: Install the serif fallbacks the overrides target
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # Builds and previews on its own, via `webServer` in playwright.config.ts.
      - name: Test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable — its
      # owner can repoint it at any commit — and this job holds `pages: write`
      # and `id-token: write`, so a retagged action could publish to the live
      # site. The trailing comment is the version each SHA corresponds to;
      # Dependabot updates SHA pins exactly as it does tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
